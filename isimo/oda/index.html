<!doctype html>
<!--
  Davet bağlantısı karşılama sayfası: https://ahmetercikan.github.io/isimo/oda/?kod=KR7ZM
  Android: uygulama yüklüyse intent:// ile açılıp odaya düşer, değilse tarayıcıda odaya (web sürümü) girilir.
  iPhone: isimsehir:// ile uygulama açılmaya çalışılır; açılmazsa "Tarayıcıda oyna" ve App Store düğmeleri.
  Bilgisayar: doğrudan web sürümünde odaya.
-->
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Oyuna davetlisin! · İsim Şehir</title>
  <meta name="description" content="Arkadaşın seni İsim Şehir odasına çağırıyor. Dokun, odaya gel!" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Oyuna davetlisin! · İsim Şehir" />
  <meta property="og:description" content="Arkadaşın seni İsim Şehir odasına çağırıyor. Dokun, odaya gel!" />
  <meta property="og:image" content="https://ahmetercikan.github.io/isimo/og.png" />
  <meta property="og:locale" content="tr_TR" />
  <meta name="theme-color" content="#2e6cf0" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="../favicon.png" />
  <style>
    :root { --blue: #2e6cf0; --deep: #1a45a8; --ink: #17181f; --muted: #686a78; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink);
      background: linear-gradient(160deg, #4a86ff, #1c4cc2); display: grid; place-items: center; padding: 24px 16px; }
    .card { width: min(100%, 420px); background: #fff; border-radius: 32px; padding: 28px 22px 24px; text-align: center;
      box-shadow: 0 20px 50px rgba(10, 20, 60, 0.3); }
    .logo { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 8px 20px rgba(0,0,0,.2); }
    h1 { font-size: 28px; margin: 14px 0 4px; letter-spacing: -0.5px; }
    p { margin: 0; color: var(--muted); font-weight: 600; }
    .code { display: flex; gap: 8px; justify-content: center; margin: 20px 0 22px; }
    .code span { width: 52px; height: 64px; border-radius: 14px; background: var(--blue); color: #fff; font-size: 34px; font-weight: 800;
      display: grid; place-items: center; box-shadow: 0 5px 0 var(--deep); }
    .btn { display: block; width: 100%; padding: 16px; border-radius: 18px; font-size: 18px; font-weight: 800; text-decoration: none; margin-top: 10px; }
    .btn--main { background: var(--blue); color: #fff; box-shadow: 0 5px 0 var(--deep); }
    .btn--alt { background: #eef2f9; color: var(--ink); }
    .stores { display: flex; gap: 8px; margin-top: 10px; }
    .stores a { flex: 1; padding: 12px 6px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 800; font-size: 15px; text-decoration: none; }
    small { display: block; margin-top: 14px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="../icons/icon-192.png" alt="İsim Şehir" />
    <h1>Oyuna davetlisin!</h1>
    <p>Arkadaşın seni İsim Şehir odasına çağırıyor.</p>
    <div class="code" id="code"></div>
    <a class="btn btn--main" id="open" href="#">Uygulamada aç</a>
    <a class="btn btn--alt" id="web" href="#">Tarayıcıda oyna</a>
    <div class="stores">
      <a href="https://play.google.com/store/apps/details?id=com.ahmetercikan.isimsehir">Google Play</a>
      <a href="https://apps.apple.com/tr/app/id6830780251">App Store</a>
    </div>
    <small>Uygulama yüklü değilse tarayıcıda da oynayabilirsin. Ücretsiz, üyelik yok.</small>
  </main>
  <script>
    (function () {
      var kod = (new URLSearchParams(location.search).get('kod') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
      var web = 'https://ahmetercikan.github.io/isimo/#/katil' + (kod ? '?kod=' + kod : '');
      var app = 'isimsehir://oda?kod=' + kod;
      var ua = navigator.userAgent;
      var android = /Android/i.test(ua);
      var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var intent = 'intent://oda?kod=' + kod + '#Intent;scheme=isimsehir;package=com.ahmetercikan.isimsehir;S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
      var box = document.getElementById('code');
      kod.split('').forEach(function (ch) { var s = document.createElement('span'); s.textContent = ch; box.appendChild(s); });
      document.getElementById('web').href = web;
      document.getElementById('open').href = android ? intent : app;
      if (!kod) return;
      if (android) location.href = intent;
      else if (ios) location.href = app;
      else location.replace(web);
    })();
  </script>
</body>
</html>
